<!doctype html>
<!-- central-de-sites:manutencao -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Site em manutenção</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font: 17px/1.6 system-ui, "Segoe UI", Roboto, sans-serif;
      background: #f4f5f7; color: #1a1d23; text-align: center;
    }
    @media (prefers-color-scheme: dark) { body { background: #0f1115; color: #e7e9ee; } p { color: #9aa1ad !important; } }
    .caixa { max-width: 460px; }
    svg { width: 72px; height: 72px; color: #f59e0b; margin-bottom: 16px; }
    h1 { font-size: 28px; margin: 0 0 10px; }
    p { margin: 0; color: #6b7280; }
  </style>
</head>
<body>
  <div class="caixa">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
    </svg>
    <h1>Site em manutenção</h1>
    <p>Estamos fazendo algumas melhorias. Voltaremos em breve.</p>
  </div>
</body>
</html>
